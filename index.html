<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Visual reference for Roblox BuilderIcons — browse, search, and download Regular & Filled variants">
<title>BuilderIcons — Roblox Icon Browser</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
</head>
<body>
<h2 class="sr-only">BuilderIcons — Roblox icon browser with Regular and Filled variants</h2>

<div class="header">
  <div class="header-top">
    <svg class="rb-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="4" fill="#e2231a"/>
      <path d="M8 24L11.2 8H22L20.3 16.4H15.7L15.1 19.6H19.7L18.8 24H8Z" fill="white"/>
    </svg>
    <h1>Builder<span>Icons</span></h1>
  </div>
  <div class="stats" id="stats">
    <div class="stat">Loading…</div>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search" placeholder="Search icons…" autocomplete="off">
  </div>
  <div class="toggle-group" id="variantToggle">
    <button class="active" data-v="both">Both</button>
    <button data-v="reg">Regular</button>
    <button data-v="fill">Filled</button>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="meta-bar">
  <div class="legend">
    <div class="legend-item"><div class="dot dot-both"></div> Both variants</div>
    <div class="legend-item"><div class="dot dot-reg"></div> Regular only</div>
    <div class="legend-item"><div class="dot dot-fill"></div> Filled only</div>
  </div>
  <div class="count-badge" id="countBadge"></div>
</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading icons from Roblox client tracker…</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
